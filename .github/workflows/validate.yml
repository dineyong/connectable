name: Validate corpus and mockup
on:
  push:
    branches: [main, research/question-corpus-foundation, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: python3 -m unittest discover -s tests -q
      - run: python3 scripts/validate_question_corpus_v2.py
      - run: python3 -m scripts.validate_official_products
      - run: python3 scripts/validate_connection_model_pilot.py
      - run: python3 scripts/path_instance_v1.py --check
      - run: python3 scripts/validate_public_usage_review.py
      - run: python3 scripts/build_site_content_v2.py --check
      - run: python3 web/derive-site-content.py --check
      - run: python3 scripts/validate_official_spec_review.py
      - run: python3 scripts/crossover_pd_evidence.py
      - run: python3 scripts/supplemental_content_review.py
      - run: python3 scripts/product_semantics.py
      - run: python3 -m scripts.content_review
      - run: python3 scripts/validate_monitor_expansion.py
      - run: python3 scripts/validate_quasarzone_intake.py
      - run: python3 scripts/build_monitor_v3.py --check
      - run: python3 scripts/build_monitor_review_links.py --check
      - run: python3 scripts/build_monitor_pages_v3.py --check
      - run: python3 scripts/validate_monitor10_supplement.py
      - run: python3 scripts/build_monitor10_review.py --check
      - run: python3 scripts/tech_news.py --check
      - run: python3 scripts/validate_local_site.py
      - name: Build isolated local launch preview (no deployment)
        run: python3 -m scripts.prepare_launch_preview --output "${RUNNER_TEMP}/connectable-launch-preview"
      - name: Build inactive Monipick release drafts (no deployment)
        run: python3 -m scripts.prepare_monipick_release --output "${RUNNER_TEMP}/monipick-release-drafts"
      - name: Build unapproved public-format candidate (no deployment)
        run: python3 -m scripts.build_monipick_public_candidate --output "${RUNNER_TEMP}/monipick-public-candidate"
      - name: Verify user-approved production files locally (no deployment)
        run: CF_PAGES_BRANCH=codex/monipick-production python3 -m scripts.build_monipick_cloudflare --output "${RUNNER_TEMP}/monipick-authorized-production"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Check public-format candidate under generated CSP (loopback only)
        run: npx playwright test --config playwright.release.config.js --workers=2

      - name: Check proposed content and links (loopback only, no deployment)
        run: npx playwright test --config playwright.content.config.js --workers=2
