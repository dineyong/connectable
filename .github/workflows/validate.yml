name: Validate corpus and mockup
on:
  push:
    branches: [research/question-corpus-foundation]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python3 -m unittest discover -s tests -q
      - run: python3 scripts/validate_question_corpus_v2.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
