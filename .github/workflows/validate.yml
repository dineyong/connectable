name: Validate corpus and mockup
on:
  push:
    branches: [research/question-corpus-foundation]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: python3 -m unittest discover -s tests -q
      - run: python3 scripts/validate_question_corpus_v2.py
      - run: python3 -m scripts.validate_official_products
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
